<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{../css/criar.css}">
    <link rel="stylesheet" th:href="@{../css/menu.css}">
    <link rel="stylesheet" th:href="@{../css/button.css}">

    <!-- JS -->
    <script th:src="@{../js/carrega/menu.js}" defer></script>
    <script th:src="@{../js/cadastra-usuario.js}" defer></script>
    <title>Cadastra usuáiro</title>
</head>
<body>

    <!-- menu -->
    <div th:replace="fragments/menu :: menu"></div>

    <div id="conteudo-lateral">
        <div class="conteudo-interno">
            <h1>Cadastrar usuário</h1>
            <form>
                <div class="campo-formulario">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome com mais de 10 caracteres">
                </div>

                <div class="campo-formulario">
                    <label for="email">Data:</label>
                    <input type="text" id="email" name="email" placeholder="teste@teste.com">
                </div>

                <button type="submit">Cadastrar</button>
            </form>
        </div>
    </div>

</body>
</html>
